[project]
name = "data-management-agent"
version = "0.1.0"
description = "An agent for file, knowledge, and data workspaces."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb",
    "huggingface-hub",
    "langchain-openai",
    "langgraph",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_management_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
system-certs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
